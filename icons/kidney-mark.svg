<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 70 380 390" width="100%" height="100%">
  <defs>
    <linearGradient id="kmKidneyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="80%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="kmHighlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="kmPelvisGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#fdf4ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="kmArteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="kmVeinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Renal Vein -->
    <path d="M175 240 C140 236 108 248 90 262" fill="none" stroke="url(#kmVeinGrad)" stroke-width="16" stroke-linecap="round"/>

    <!-- Renal Artery -->
    <path d="M185 272 C150 274 122 290 102 312" fill="none" stroke="url(#kmArteryGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Ureter -->
    <path d="M220 310 C210 360 178 405 160 435" fill="none" stroke="#94a3b8" stroke-width="18" stroke-linecap="round"/>
    <path d="M220 310 C210 360 178 405 160 435" fill="none" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>

    <!-- Kidney Body -->
    <path d="M260 88
             C330 84 410 135 425 220
             C440 305 405 385 345 420
             C285 455 235 435 220 380
             C210 345 212 320 185 295
             C165 275 168 245 190 220
             C215 190 205 160 215 130
             C225 102 242 89 260 88 Z"
          fill="url(#kmKidneyGrad)" />

    <!-- Cortex Outer Edge Highlight -->
    <path d="M265 98
             C325 95 395 142 410 220
             C422 290 395 365 340 405"
          fill="none" stroke="url(#kmHighlightGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Calyces -->
    <path d="M290 160 C325 165 340 185 335 205 C330 215 315 215 300 205 C275 190 270 175 290 160 Z"
          fill="url(#kmPelvisGrad)" opacity="0.85"/>
    <path d="M325 240 C358 248 365 272 355 290 C345 302 328 298 315 285 C295 265 295 248 325 240 Z"
          fill="url(#kmPelvisGrad)" opacity="0.85"/>
    <path d="M280 340 C310 355 315 375 300 390 C285 400 270 392 260 375 C248 355 255 340 280 340 Z"
          fill="url(#kmPelvisGrad)" opacity="0.85"/>

    <!-- Central Renal Pelvis Core -->
    <path d="M225 260
             C250 230 290 235 295 265
             C300 295 270 315 240 305
             C225 300 215 285 225 260 Z"
          fill="#ffffff" opacity="0.7"/>
  </g>
</svg>